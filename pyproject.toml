[project]
name = "cloudtrail-mlops"
version = "1.0.0"
description = "AAI-540 Group 3: CloudTrail suspicious-activity classifier on Amazon SageMaker"
requires-python = ">=3.9"

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["cloudtrail_mlops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/cloudtrail_mlops/features.py" = ["E501"]  # long SQL lines are easier to read unwrapped
